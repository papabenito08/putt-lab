<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Square Face">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Square Face Putting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first launch-monitor screen; green canvas is the hero, launch numbers in scoreboard type */
:root{
  --bg:#EDF2EC; --surface:#FFFFFF; --surface2:#F5F8F4; --ink:#10281D; --muted:#5A6E62; --line:#D2DDD3;
  --green:#1E6A44; --green-soft:#DCEBE1; --flag:#E2A913; --flag-ink:#3A2A00;
  --good:#1D8A4B; --bad:#C0442C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1611; --surface:#13231A; --surface2:#182C21; --ink:#E5EFE8; --muted:#90A698; --line:#25392D;
  --green:#52C28E; --green-soft:#1C3A2A; --flag:#F2C230; --flag-ink:#2A1F00;
  --good:#4FCB83; --bad:#EE7458; color-scheme:dark}}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-width:0}
.brand{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:clamp(14px,4.4vw,26px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--green)}
h2{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0 0 4px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--surface)}
.btn.flag{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn.block{width:100%} .btn.big{min-height:60px;font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
.aiminfo{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:-4px}
.aiminfo .linkbtn{padding:4px}
.aiminfo div{flex-basis:100%}
#green{cursor:crosshair;touch-action:manipulation}
.installcard{border-color:var(--green);margin-bottom:12px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:8px 4px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[type=range]{width:100%;accent-color:var(--green)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--green);flex:none}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;flex:none}
.stepper b{font-family:var(--display);font-size:28px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
/* live screen */
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:1;min-width:0;max-width:52%;background:var(--surface);border:1px solid var(--line)}
#statustxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.status i{flex-shrink:0}
.status i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.ready i{background:var(--good)} .status.ready{border-color:var(--good)}
.status.busy i{background:var(--flag)}
.status.err i{background:var(--bad)}
.holeinfo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.holeinfo .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.greenwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#2E7A49}
#green{display:block;width:100%;height:auto}
.inset{position:absolute;right:8px;top:8px;width:30%;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.85);background:#000;cursor:pointer}
.camlarge{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}

.camwrap{position:relative;width:100%}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.camwrap video{object-fit:fill}
.verdict{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-size:34px;font-weight:700;color:#fff;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.impgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.impimg{width:100%;border-radius:10px;display:block}
.impside{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:12px;align-items:center}
.impsvg{width:100%;color:var(--ink);background:var(--surface2);border-radius:10px}
@media(max-width:420px){.impgrid{grid-template-columns:1fr}}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;min-width:0}
.num span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{display:block;font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{font-size:12px;color:var(--muted)}
@media (max-width:420px){.num b{font-size:25px}}
.card table{width:100%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td:first-child,th:first-child{text-align:left}
td.cur{background:var(--green-soft)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
svg text{fill:var(--muted);font-family:var(--body)}
.tip{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.tip ol,.tip ul{margin:6px 0 0;padding-left:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:620px;width:100%}
.tabs button{background:none;border:0;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.tabs button[aria-current="page"]{color:var(--green);background:var(--green-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.level{font-family:var(--display);font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">Square Face <span>Putting</span></div><span class="status" id="status" hidden><i></i><span id="statustxt">Caméra arrêtée</span></span></div>
  <main id="view"></main>
</div>

</div></nav>

  "Pose la balle <b>près du bord de l'image opposé à la cible</b>, pour qu'elle reste visible le plus longtemps.":["Place the ball <b>near the edge of the image opposite the target</b>, so it stays visible as long as possible.","Coloca la bola <b>cerca del borde de la imagen opuesto al objetivo</b>, para que se vea el mayor tiempo posible.","Leg den Ball <b>nahe an den Bildrand gegenüber dem Ziel</b>, damit er möglichst lange sichtbar bleibt."],

const I18N_MISS=new Set();
function t(fr, vars){
  const L=curLang(); let s=fr;
  if(L!=="fr"){ const e=I18N[fr]; if(e&&e[LIDX[L]]!=null) s=e[LIDX[L]]; else I18N_MISS.add(fr); }
  return vars ? s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?String(vars[k]):m) : s;
}
const nf = (x,d=1) => (x==null||isNaN(x)) ? "–" : x.toLocaleString(LOC[curLang()],{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtM = m => m<1 ? Math.round(m*100)+" cm" : nf(m,1)+" m";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function dirTxt(d){ if(d==null) return "–"; const a=Math.abs(d), sd=SIDES[curLang()]; return a<0.05?nf(0,1)+"°":nf(a,1)+"° "+(d>0?sd[0]:sd[1]); }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }

/* Roll deceleration from the Stimpmeter: ball leaves the ramp at 1.83 m/s and rolls S feet. */
const decel = stimp => STIMP_V*STIMP_V/(2*stimp*0.3048);
const flatDistance = (v,stimp) => v*v/(2*decel(stimp));

/* 2D roll on a plane green. slope: downhill direction (unit, world) and grade in %.
   World: x = right, y = forward. Rolling sphere on an incline accelerates at 5/7·g·sin(a). */
function simulate(start, hole, v0, dirDeg, green){
  const a0=decel(green.stimp);
  const gs = 5/7*G*Math.sin(Math.atan(green.slope/100));
  const gx=green.down.x*gs, gy=green.down.y*gs;
  const dx=hole.x-start.x, dy=hole.y-start.y, L=Math.hypot(dx,dy)||1;
  const u={x:dx/L,y:dy/L}, r={x:u.y,y:-u.x}, th=dirDeg*Math.PI/180;
  let vx=v0*(Math.cos(th)*u.x+Math.sin(th)*r.x), vy=v0*(Math.cos(th)*u.y+Math.sin(th)*r.y);
  let x=start.x, y=start.y, t=0; const dt=1/240, path=[{x,y,t}];
  let holed=false, minD=1e9;
  for(let i=0;i<240*30;i++){
    const sp=Math.hypot(vx,vy);
    const d=Math.hypot(x-hole.x,y-hole.y); minD=Math.min(minD,d);
    if(d<HOLE_R){ const vcap=1.63*Math.sqrt(Math.max(0,1-(d/HOLE_R)**2))+0.05; if(sp<vcap){ holed=true; x=hole.x; y=hole.y; path.push({x,y,t}); break; } }
    if(sp<a0*dt*1.5){ if(gs<a0*0.9) break; }
    const ax = (sp>1e-6? -a0*vx/sp : 0) + gx, ay = (sp>1e-6? -a0*vy/sp : 0) + gy;
    vx+=ax*dt; vy+=ay*dt; x+=vx*dt; y+=vy*dt; t+=dt;
    if(i%4===0) path.push({x,y,t});
  }
  path.push({x,y,t});
  const end={x,y}, rest=Math.hypot(end.x-hole.x,end.y-hole.y);
  // end relative to the line: along (+ long / - short), lateral (+ right / - left)
  const ex=end.x-hole.x, ey=end.y-hole.y;
  return {path, holed, end, rest:holed?0:rest, along:ex*u.x+ey*u.y, lat:ex*r.x+ey*r.y, time:t};
}
function readGreen(start, hole, green){
  const dx=hole.x-start.x, dy=hole.y-start.y, L=Math.hypot(dx,dy)||1, u={x:dx/L,y:dy/L}, r={x:u.y,y:-u.x};
  const along=-(green.down.x*u.x+green.down.y*u.y)*green.slope; // + = uphill
  const side=(green.down.x*r.x+green.down.y*r.y)*green.slope;   // + = breaks right
  const parts=[];
  if(Math.abs(along)<0.3) parts.push(t("à plat")); else parts.push(t(along>0?"montée {p} %":"descente {p} %",{p:nf(Math.abs(along),1)}));
  if(Math.abs(side)>=0.3) parts.push(t(side>0?"casse vers la droite ({p} %)":"casse vers la gauche ({p} %)",{p:nf(Math.abs(side),1)})); else parts.push(t("droit"));
  return parts.join(" · ");
}

const S = { tab:"play", players:[], rounds:[], shots:[],
  settings:{stimp:10, voice:true, testMode:false, aimDeg:0, putDir:"left", calib:null, practiceD:3, practiceSlope:"flat", lang:"auto"},
  round:null, practice:null, last:null, statP:"all", camLarge:false, loaded:false };

function save(){ try{ localStorage.setItem(LS, JSON.stringify({players:S.players,rounds:S.rounds.slice(0,200),shots:S.shots.slice(-1500),settings:S.settings})); }catch(e){ toast(t("Mémoire du téléphone pleine : exporte puis efface des données.")); } }

/* =================== camera launch monitor =================== */
const CAMWRAP=$("#camwrap"), cam=$("#cam"), camov=$("#camov"), octx=camov.getContext("2d");
const proc=document.createElement("canvas"), pctx=proc.getContext("2d",{willReadFrequently:true});
const LM = { stream:null, running:false, state:"off", PW:0, PH:0, ball:null, cand:null, candN:0, frameN:0,
  grays:[], imgs:[], pts:[], lastSeenT:0, impactIdx:-1, onShot:null, aim:{x:0,y:-1}, lostN:0, lastT:0, fps:0, err:"" };
/* Status pill: the French text is kept so it can be re-translated when the language changes. */
function setStatus(cls, txt, vars){ LM.statusArgs=[cls,txt,vars]; const s=$("#status"); s.hidden=false; s.className="status "+cls; $("#statustxt").textContent=t(txt,vars); }
function refreshStatus(){ const a=LM.statusArgs; $("#statustxt").textContent = a ? t(a[1],a[2]) : t("Caméra arrêtée"); }
async function camStart(){
  if(S.settings.testMode){ setStatus("ready","Mode test (sans caméra)"); return; }
  if(LM.running) return;
  try{
    LM.stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60}}});
    cam.srcObject=LM.stream; await cam.play();
    await new Promise(r=>{ if(cam.videoWidth) r(); else cam.onloadedmetadata=r; });
    const sc=Math.min(1,640/Math.max(cam.videoWidth,cam.videoHeight));
    LM.PW=Math.round(cam.videoWidth*sc); LM.PH=Math.round(cam.videoHeight*sc);
    proc.width=camov.width=LM.PW; proc.height=camov.height=LM.PH;
    $("#camwrap").style.aspectRatio = LM.PW+" / "+LM.PH;
    LM.running=true; LM.state="search"; LM.ball=null; LM.cand=null; LM.grays=[];
    setAim(); setStatus("busy", S.settings.calib ? "Pose la balle à sa place" : "Touche la balle sur l'image");
    try{ if(navigator.wakeLock) LM.wake=await navigator.wakeLock.request("screen"); }catch(e){}
    loop();
  }catch(e){
    LM.err = location.protocol!=="https:"&&location.hostname!=="localhost" ? t("La caméra demande une adresse https.") : t("Caméra refusée ou indisponible. Autorise la caméra pour Square Face Putting dans les réglages du téléphone.");
    setStatus("err","Caméra indisponible"); toast(LM.err);
  }
}
function camStop(){
  LM.running=false; LM.state="off";
  if(LM.stream){ LM.stream.getTracks().forEach(t=>t.stop()); LM.stream=null; }
  try{ LM.wake && LM.wake.release(); }catch(e){} LM.wake=null;
  $("#status").hidden=true;
}
const DIR_BASE={up:0,down:180,left:-90,right:90};
function setAim(){ const a=((DIR_BASE[S.settings.putDir]||0)+(S.settings.aimDeg||0))*Math.PI/180; LM.aim={x:Math.sin(a),y:-Math.cos(a)}; }
function loop(){
  if(!LM.running) return;
  const cb=(now,meta)=>{ if(!LM.running) return; try{ frame(meta&&meta.mediaTime!=null?meta.mediaTime:performance.now()/1000); }catch(e){ console.error(e); } loop(); };
  if(cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(cb); else requestAnimationFrame(t=>cb(t,null));
}
const W8=(d,i)=>Math.min(d[i],d[i+1],d[i+2]);
function frame(t){
  if(t===LM.lastT) return; const dtf=t-LM.lastT; if(dtf>0&&dtf<1) LM.fps=LM.fps*0.9+0.1/dtf; LM.lastT=t;
  const PW=LM.PW, PH=LM.PH;
  pctx.drawImage(cam,0,0,PW,PH);
  const img=pctx.getImageData(0,0,PW,PH), d=img.data;
  // grayscale ring buffer for the putter-face measurement
  const old = LM.grays.length>=8 ? LM.grays.shift() : null;
  const g = old&&old.g.length===PW*PH ? old.g : new Uint8Array(PW*PH), c = old&&old.c.length===PW*PH ? old.c : new Uint8Array(PW*PH);
  for(let i=0,j=0;j<g.length;i+=4,j++){ g[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8; const gi=d[i+1]-((d[i]+d[i+2])>>1); c[j]=gi<0?0:gi>255?255:gi; }
  LM.grays.push({t,g,c});
  LM.imgs.push(img); if(LM.imgs.length>LM.grays.length) LM.imgs.splice(0,LM.imgs.length-LM.grays.length);
  LM.lastImg=img;
  LM.frameN++;
  if(LM.state==="search"){
    if(!S.settings.calib){ if(LM.frameN%30===0) setStatus("busy","Touche la balle sur l'image"); }
    else if(LM.frameN%4===0){
      const b=findBall(d,PW,PH);
      if(b && LM.cand && Math.hypot(b.x-LM.cand.x,b.y-LM.cand.y)<Math.max(2,b.r*0.35)){ LM.candN++; LM.cand=b; }
      else { LM.cand=b; LM.candN=b?1:0; }
      if(LM.candN>=6){ LM.ball=LM.cand; LM.state="armed"; LM.lastSeenT=t; LM.bg=null; LM.goneN=0; setStatus("ready","Prêt : putte ! ({n} images/s)",{n:Math.round(LM.fps)}); }
    }
  } else if(LM.state==="armed"){
    const b=LM.ball, T=b.w*0.7;
    // background whiteness, refreshed while the ball sits still (static white marks are then ignored)
    const pres=presence(d,PW,b,T);
    if(pres>0.45 && (!LM.bg || LM.bg.length!==PW*PH || LM.frameN%20===0)){ if(!LM.bg||LM.bg.length!==PW*PH) LM.bg=new Uint8Array(PW*PH); const bg=LM.bg; for(let i=0,j=0;j<bg.length;i+=4,j++) bg[j]=Math.min(d[i],d[i+1],d[i+2]); }
    if(pres>0.45){
      LM.lastSeenT=t; LM.goneN=0;
      if(LM.frameN%10===0){ const det=detectAt(d,PW,PH,b,b.r*1.2,T,b.r); if(det&&Math.hypot(det.x-b.x,det.y-b.y)<b.r*0.4){ b.x=b.x*0.7+det.x*0.3; b.y=b.y*0.7+det.y*0.3; } }
    } else {
      LM.goneN=(LM.goneN||0)+1;
      if(LM.goneN===1){ const k=LM.grays.length-3; LM.impactImg = k>=0 ? LM.imgs[k] : null; LM.faceFrames = k>=3 ? {A:LM.grays[k].g.slice(), Ac:LM.grays[k].c.slice(), B:LM.grays[k-3].g.slice(), Bc:LM.grays[k-3].c.slice()} : null; LM.goneT=LM.grays[LM.grays.length-2].t; }
      const first=findAhead(d,PW,PH,b,t-LM.goneT+1/30);
      if(first){
        LM.state="track"; LM.pts=[{x:b.x,y:b.y,t:LM.goneT,start:true},{x:first.x,y:first.y,t}]; LM.lostN=0;
        setStatus("busy","Mesure…");
      } else if(LM.goneN>4){ // not a putt (hand, shadow): wait for the ball to come back
        if(t-LM.lastSeenT>1.2){ LM.state="search"; LM.ball=null; LM.cand=null; LM.candN=0; setStatus("busy","Pose la balle à sa place"); }
      }
    }
  } else if(LM.state==="track"){
    const p=LM.pts, n=p.length, last=p[n-1], b=LM.ball, a=LM.aim;
    let vx,vy,dt;
    if(n>=3){ const q=p[n-2]; dt=(last.t-q.t)||1/30; vx=(last.x-q.x)/dt; vy=(last.y-q.y)/dt; }
    else { dt=(last.t-p[0].t)||1/30; vx=(last.x-p[0].x)/dt; vy=(last.y-p[0].y)/dt; }
    const step=t-last.t, pred={x:last.x+vx*step,y:last.y+vy*step}, sp=Math.hypot(vx,vy)*step;
    const blobs=findBlobs(d,PW,PH,pred,Math.max(b.r*3,sp*0.7+b.r*2),b.w*0.55,b.r);
    let best=null;
    for(const c of blobs){
      const fw=(c.x-last.x)*a.x+(c.y-last.y)*a.y; if(fw<b.r*0.2) continue; // must keep moving forward
      const dd=Math.hypot(c.x-pred.x,c.y-pred.y); if(!best||dd<best.dd){ best=c; best.dd=dd; }
    }
    if(best){ p.push({x:best.x,y:best.y,t}); LM.lostN=0; } else LM.lostN++;
    const out = pred.x<b.r||pred.y<b.r||pred.x>PW-b.r||pred.y>PH-b.r;
    if(p.length>=10 || LM.lostN>=2 || out || t-p[0].t>0.7) finishShot();
  }
  drawCamOverlay();
}
/* Ball finder, after calibration: round white blob of the calibrated size, near the calibrated spot.
   Threshold is local (brightest pixel in the search zone), so a lamp reflection elsewhere doesn't matter. */
function findBall(d,PW,PH){
  const C=S.settings.calib; if(!C) return null;
  const cx=C.x*PW, cy=C.y*PH, cr=C.r*PW, R=Math.max(cr*10, Math.max(PW,PH)*0.22);
  const x0=Math.max(0,Math.floor(cx-R)), x1=Math.min(PW,Math.ceil(cx+R)), y0=Math.max(0,Math.floor(cy-R)), y1=Math.min(PH,Math.ceil(cy+R));
  let mx=0; for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){ const w=W8(d,(y*PW+x)*4); if(w>mx) mx=w; }
  if(mx<80) return null;
  const T=Math.max(70,mx*0.75), gw=x1-x0, gh=y1-y0, mask=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++) if(W8(d,((y+y0)*PW+x+x0)*4)>=T) mask[y*gw+x]=1;
  let best=null; const st=[];
  for(let i=0;i<mask.length;i++){
    if(mask[i]!==1) continue;
    let n=0,sx=0,sy=0,bx0=1e9,bx1=-1,by0=1e9,by1=-1; st.push(i); mask[i]=2;
    while(st.length){ const k=st.pop(), x=k%gw, y=(k/gw)|0; n++; sx+=x; sy+=y; if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y;
      if(n>20000) break;
      if(x>0&&mask[k-1]===1){mask[k-1]=2;st.push(k-1);} if(x<gw-1&&mask[k+1]===1){mask[k+1]=2;st.push(k+1);}
      if(y>0&&mask[k-gw]===1){mask[k-gw]=2;st.push(k-gw);} if(y<gh-1&&mask[k+gw]===1){mask[k+gw]=2;st.push(k+gw);} }
    st.length=0;
    const w=bx1-bx0+1, h=by1-by0+1, r=Math.sqrt(n/Math.PI);
    if(r<cr*0.6||r>cr*1.6) continue;
    const ar=w/h, fill=n/(Math.PI*(Math.max(w,h)/2)**2);
    if(ar<0.7||ar>1.4||fill<0.6) continue;
    const c={x:sx/n+x0, y:sy/n+y0, r, w:mx};
    const score=Math.hypot(c.x-cx,c.y-cy)/cr + Math.abs(r-cr)/cr*3;
    if(!best||score<best.score){ best=c; best.score=score; }
  }
  return best;
}
/* One tap on the camera image: take the white blob under the finger as the ball and remember its size and place. */
function selectBallAt(px,py){
  const img=LM.lastImg; if(!img){ toast(t("La caméra démarre, réessaie.")); return; }
  const d=img.data, PW=LM.PW, PH=LM.PH, R=Math.round(Math.max(PW,PH)/14);
  let mx=0,bx=px,by=py;
  for(let y=Math.max(0,py-R|0);y<Math.min(PH,py+R);y++) for(let x=Math.max(0,px-R|0);x<Math.min(PW,px+R);x++){ const w=W8(d,(y*PW+x)*4)-0.6*Math.hypot(x-px,y-py); if(w>mx){mx=w;bx=x;by=y;} }
  const peak=W8(d,(by*PW+bx)*4);
  if(peak<70){ toast(t("Je ne vois pas de balle blanche à cet endroit.")); return; }
  const T=peak*0.75, seen=new Uint8Array(PW*PH), st=[by*PW+bx]; seen[st[0]]=1; let n=0,sx=0,sy=0;
  while(st.length && n<6000){ const k=st.pop(), x=k%PW, y=(k/PW)|0; n++; sx+=x; sy+=y;
    for(const nb of [x>0?k-1:-1, x<PW-1?k+1:-1, y>0?k-PW:-1, y<PH-1?k+PW:-1]){ if(nb>=0&&!seen[nb]&&W8(d,nb*4)>=T){ seen[nb]=1; st.push(nb); } } }
  const r=Math.sqrt(n/Math.PI);
  if(n>=6000||r>Math.max(PW,PH)/8){ toast(t("Zone trop grande : touche bien la balle, sur un fond uni.")); return; }
  if(r<2){ toast(t("Balle trop petite : rapproche un peu le téléphone.")); return; }
  const c={x:sx/n,y:sy/n,r,w:peak};
  S.settings.calib={x:c.x/PW,y:c.y/PH,r:c.r/PW}; save();
  LM.ball=c; LM.state="armed"; LM.lastSeenT=LM.lastT; LM.bg=null; setStatus("ready","Prêt : putte !");
  toast(t("Balle repérée ({n} px). Tu peux putter.",{n:Math.round(c.r*2)}));
}
/* Share of the ball's disk that is still white: drops when the ball leaves its spot. */
function presence(d,PW,b,T){
  const R=Math.max(1.5,b.r*0.7); let n=0,k=0;
  for(let y=Math.round(b.y-R);y<=b.y+R;y++) for(let x=Math.round(b.x-R);x<=b.x+R;x++){ if((x-b.x)**2+(y-b.y)**2>R*R) continue; n++; if(W8(d,(y*PW+x)*4)>=T) k++; }
  return n?k/n:0;
}
/* White blobs (new compared with the background) inside a square window. Blurred balls are accepted (streaks). */
function findBlobs(d,PW,PH,c,R,T,br){
  const x0=Math.max(0,Math.floor(c.x-R)), y0=Math.max(0,Math.floor(c.y-R)), x1=Math.min(PW,Math.ceil(c.x+R)), y1=Math.min(PH,Math.ceil(c.y+R));
  const gw=x1-x0, gh=y1-y0; if(gw<2||gh<2) return [];
  const bg=LM.bg, m=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){ const i=(y+y0)*PW+x+x0, w=W8(d,i*4); if(w>=T && (!bg || w-bg[i]>=25)) m[y*gw+x]=1; }
  const out=[], st=[], A=Math.PI*br*br;
  for(let i=0;i<m.length;i++){
    if(m[i]!==1) continue; let n=0,sx=0,sy=0; st.push(i); m[i]=2;
    while(st.length){ const k=st.pop(), x=k%gw, y=(k/gw)|0; n++; sx+=x; sy+=y;
      if(x>0&&m[k-1]===1){m[k-1]=2;st.push(k-1);} if(x<gw-1&&m[k+1]===1){m[k+1]=2;st.push(k+1);}
      if(y>0&&m[k-gw]===1){m[k-gw]=2;st.push(k-gw);} if(y<gh-1&&m[k+gw]===1){m[k+gw]=2;st.push(k+gw);} }
    if(n<A*0.25||n>A*5) continue;
    out.push({x:sx/n+x0,y:sy/n+y0,n});
  }
  return out;
}
/* First sighting after the ball left its spot: look only in a cone ahead (never behind, where the putter is),
   within what a ball can travel (max 6 m/s), and take the blob farthest ahead: the ball always outruns the putter. */
function findAhead(d,PW,PH,b,el){
  const mmpx=BALL_R_MM/b.r, maxF=Math.max(b.r*3, 6000*el/mmpx+b.r*2), a=LM.aim, r={x:-a.y,y:a.x};
  const c={x:b.x+a.x*maxF/2,y:b.y+a.y*maxF/2};
  const blobs=findBlobs(d,PW,PH,c,maxF/2+b.r*2,b.w*0.55,b.r);
  let best=null;
  for(const q of blobs){
    const f=(q.x-b.x)*a.x+(q.y-b.y)*a.y, s=(q.x-b.x)*r.x+(q.y-b.y)*r.y;
    if(f<b.r*0.5||f>maxF) continue;
    if(Math.abs(s)>f*0.45+b.r) continue; // within ~25° of the aim line
    if(!best||f>best.f){ best=q; best.f=f; }
  }
  return best;
}
function detectAt(d,PW,PH,pred,R,T,br){
  const x0=Math.max(0,Math.floor(pred.x-R)), y0=Math.max(0,Math.floor(pred.y-R)), x1=Math.min(PW,Math.ceil(pred.x+R)), y1=Math.min(PH,Math.ceil(pred.y+R));
  if(x1-x0<2||y1-y0<2) return null;
  let best=-1e9,bx=0,by=0,f=false;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){ const v=W8(d,(y*PW+x)*4); if(v<T) continue; const s=v-1.5*Math.hypot(x-pred.x,y-pred.y); if(s>best){best=s;bx=x;by=y;f=true;} }
  if(!f) return null;
  const rr=br*1.6+2; let sx=0,sy=0,n=0;
  for(let y=Math.max(0,Math.floor(by-rr));y<Math.min(PH,by+rr);y++) for(let x=Math.max(0,Math.floor(bx-rr));x<Math.min(PW,bx+rr);x++){ if(W8(d,(y*PW+x)*4)>=T&&Math.hypot(x-bx,y-by)<=rr){sx+=x;sy+=y;n++;} }
  if(n<3) return null;
  return {x:sx/n,y:sy/n,n};
}

function measureFace(b,mmpx){

  const sMax=70*pxmm, fMin=-(BALL_R_MM+110)*pxmm, fMax=-(BALL_R_MM*0.9)*pxmm;

function newGreen(rand, flat){
  if(flat) return {stimp:S.settings.stimp, slope:0, down:{x:0,y:-1}};
  const ang=rand()*Math.PI*2; return {stimp:S.settings.stimp, slope:Math.round((0.4+rand()*2.2)*10)/10, down:{x:Math.cos(ang),y:Math.sin(ang)}};
}
function newRound(players, nHoles){
  const seed=(Math.random()*1e9)|0, rand=rng(seed), holes=[];
  for(let i=0;i<nHoles;i++){ const D=Math.round((1.2+rand()*9)*2)/2; holes.push({D, green:newGreen(rand,false)}); }

/* Real golf order on each hole: everybody putts once in turn, then the ball farthest from the hole plays next,

function holeState(R){

function onShot(shot){

  shot.mode=mode; shot.D=Math.hypot(ctx.hole.x-ctx.start.x,ctx.hole.y-ctx.start.y); shot.holed=sim.holed; shot.rest=sim.rest; shot.along=sim.along; shot.lat=sim.lat;

function makeApplause(dur){

  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);

      const f1=700+Math.random()*900, f2=1800+Math.random()*1600, rate=3.5+Math.random()*2.5, vol=0.4+Math.random()*0.6;
      const start=Math.random()*0.5, stop=dur*(0.6+Math.random()*0.35);
      const len=Math.floor(sr*0.045), tau=sr*(0.008+Math.random()*0.006);
      for(let t=start;t<stop;t+=(1/rate)*(0.8+Math.random()*0.4)){
        const raw=new Float32Array(len); for(let i=0;i<len;i++) raw[i]=(Math.random()*2-1)*Math.min(1,i/(sr*0.0008))*Math.exp(-i/tau);

function drawBoards(b,dpr,P,o){

/* Closest the ball came to the hole along its path (m). */
function closest(sim, hole){ let m=1e9; for(const q of sim.path) m=Math.min(m,Math.hypot(q.x-hole.x,q.y-hole.y)); return m; }
function showVerdict(){
  const L=S.last; if(!L||L.verdictShown) return; L.verdictShown=true;
  const v=$("#verdict"); if(v){ v.textContent = L.sim.holed ? t("Dans le trou !") : t("Reste {d}",{d:fmtM(L.sim.rest)}); }
  const nearMiss=!L.sim.holed && closest(L.sim, L.ctx.hole)<=0.40;
  if(L.sim.holed) playCup(); else if(nearMiss) playOh();
  setTimeout(()=>speakResult(L.sim), L.sim.holed?1500:((nearMiss&&S.settings.sfx!==false)?1600:0));
  if(L.after){ const f=L.after; L.after=null; setTimeout(()=>{ S.last=null; f(); }, 2600); }
}

function render(){

function stat(arr){ if(!arr.length) return {m:null,sd:null}; const m=arr.reduce((a,b)=>a+b,0)/arr.length; const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length); return {m,sd}; }
function viewStats(){
  if(!S.players.length) return `<div class="empty">${t("Ajoute un joueur pour commencer.")}</div>`;
  const pid=S.statP, shots=S.shots.filter(s=>pid==="all"||s.p===pid);
  let h=`<div class="row" style="margin:4px 0 8px"><button class="chip" data-act="statp" data-id="all" aria-pressed="${pid==="all"}">${t("Tous")}</button>${S.players.map(p=>`<button class="chip" data-act="statp" data-id="${p.id}" aria-pressed="${pid===p.id}">${esc(p.name)}</button>`).join("")}</div>`;
  if(!shots.length) return h+`<div class="empty card">${t("Aucun putt mesuré pour l'instant.")}</div>`;
  const dir=stat(shots.map(s=>s.dir)), face=stat(shots.map(s=>s.face)), holed=shots.filter(s=>s.holed).length;
  const within1=shots.filter(s=>Math.abs(s.dir)<=1).length;
  const short=shots.filter(s=>!s.holed&&s.along<0).length, long=shots.filter(s=>!s.holed&&s.along>0).length;
  h+=`<div class="kpis">
    <div class="kpi"><span>${t("Putts mesurés")}</span><b>${shots.length}</b></div>
    <div class="kpi"><span>${t("Rentrés")}</span><b>${t("{n} %",{n:Math.round(100*holed/shots.length)})}</b></div>
    <div class="kpi"><span>${t("Direction moyenne")}</span><b>${dirTxt(dir.m)}</b><span>${t("dispersion ±{n}°",{n:nf(dir.sd,1)})}</span></div>
    <div class="kpi"><span>${t("Face moyenne")}</span><b>${dirTxt(face.m)}</b><span>${t("dispersion ±{n}°",{n:nf(face.sd,1)})}</span></div>
    <div class="kpi"><span>${t("Départ à ±1°")}</span><b>${t("{n} %",{n:Math.round(100*within1/shots.length)})}</b></div>
    <div class="kpi"><span>${t("Ratés court / long")}</span><b>${short} / ${long}</b></div></div>`;
  // start direction histogram
  const bins=[-3,-2,-1,0,1,2,3], counts=bins.map(b=>shots.filter(s=>Math.round(Math.max(-3,Math.min(3,s.dir)))===b).length), mx=Math.max(1,...counts);
  const W=320,H=150,bw=(W-20)/bins.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("Répartition de la direction de départ"))}">`;
  bins.forEach((b,i)=>{ const hh=(H-40)*counts[i]/mx, x=10+i*bw+bw*0.15, w=bw*0.7, y=H-26-hh;
    svg+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1,hh)}" rx="4" fill="${b===0?"var(--green)":"var(--flag)"}"/>${counts[i]?`<text x="${x+w/2}" y="${y-4}" font-size="11" text-anchor="middle" style="fill:var(--ink)">${counts[i]}</text>`:""}<text x="${x+w/2}" y="${H-10}" font-size="11" text-anchor="middle">${b===0?"0°":(b<0?Math.abs(b)+(b===-3?"+":"")+"° "+SIDES[curLang()][1]:b+(b===3?"+":"")+"° "+SIDES[curLang()][0])}</text>`; });
  svg+=`</svg>`;
  h+=`<h2>${t("Direction de départ")}</h2><div class="card">${svg}</div>`;
  h+=`<h2>${t("Derniers putts")}</h2><div class="card tablewrap"><table><thead><tr><th>${t("Quand")}</th><th>${t("Vitesse")}</th><th>${t("Dir.")}</th><th>${t("Face")}</th><th>${t("Dist.")}</th><th>${t("Résultat")}</th></tr></thead><tbody>
   ${shots.slice(-25).reverse().map(s=>`<tr><td class="small">${new Date(s.t).toLocaleDateString(LOC[curLang()],{day:"numeric",month:"short"})} ${new Date(s.t).toLocaleTimeString(LOC[curLang()],{hour:"2-digit",minute:"2-digit"})}</td><td>${nf(s.v,2)}</td><td>${dirTxt(s.dir)}</td><td>${dirTxt(s.face)}${s.faceMeasured?"":"*"}</td><td>${nf(s.flat,1)} m</td><td>${s.holed?t("Rentré"):fmtM(s.rest)}</td></tr>`).join("")}
  </tbody></table></div><p class="small muted" style="margin-top:6px">${t("* face estimée à partir de la direction de départ. Distance : à plat, au Stimp choisi.")}</p>`;
  return h;
}

function addPlayer(name){ name=(name||"").trim().slice(0,24); if(!name) return toast(t("Écris un prénom.")); S.players.push({id:uid(),name}); save(); render(); }
function bind(){
  document.querySelectorAll("#view [data-act]").forEach(el=>el.addEventListener("click",onAct));
  const on=(id,ev,fn)=>{ const e=$(id); if(e) e.addEventListener(ev,fn); };
  on("#voice","change",e=>{ S.settings.voice=e.target.checked; save(); });
  on("#sfx","change",e=>{ S.settings.sfx=e.target.checked; save(); if(e.target.checked) playCup(); });
  on("#applfile","change",async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    if(f.size>1500000){ toast(t("Fichier trop lourd : prends un son de moins de 1,5 Mo (quelques secondes).")); return; }
    try{ const ab=await f.arrayBuffer(); audioUnlock(); await AC.decodeAudioData(ab.slice(0)); let s2=""; const u=new Uint8Array(ab); for(let i=0;i<u.length;i+=8192) s2+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
      localStorage.setItem("puttlab-applause",btoa(s2)); APPLAUSE=null; toast(t("Son d'applaudissements enregistré")); render(); audioUnlock(); applause(AC.currentTime+0.05,3); }
    catch(err){ toast(t("Ce fichier son n'est pas lisible ou trop gros pour le téléphone.")); } });
  on("#ohfile","change",async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    if(f.size>700000){ toast(t("Fichier trop lourd : prends un son de moins de 700 Ko (2 ou 3 secondes).")); return; }
    try{ const ab=await f.arrayBuffer(); audioUnlock(); await AC.decodeAudioData(ab.slice(0)); let s2=""; const u=new Uint8Array(ab); for(let i=0;i<u.length;i+=8192) s2+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
      localStorage.setItem("puttlab-oh",btoa(s2)); OHBUF=null; toast(t("Son du putt raté enregistré")); render(); playOh(); }
    catch(err){ toast(t("Ce fichier son n'est pas lisible ou trop gros pour le téléphone.")); } });
  on("#voicesel","change",e=>{ S.settings.voiceURI=e.target.value; save(); sayText(t("Bonjour, je serai ta voix sur le green."), true); });
  on("#vpitch","change",e=>{ S.settings.vPitch=+e.target.value; save(); sayText(t("Drapeau à {d}. ",{d:sayDist(4)}).trim(), true); });
  on("#vrate","change",e=>{ S.settings.vRate=+e.target.value; save(); sayText(t("Drapeau à {d}. ",{d:sayDist(4)}).trim(), true); });
  on("#testmode","change",e=>{ S.settings.testMode=e.target.checked; save(); });
  on("#newplayer","keydown",e=>{ if(e.key==="Enter") addPlayer(e.target.value); });
  on("#importinput","change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) importData(f); });
  on("#tv","input",e=>{ S.tv=+e.target.value; $("#tvv").textContent=nf(S.tv,2)+" m/s"; });
  on("#td","input",e=>{ S.td=+e.target.value; $("#tdv").textContent=dirTxt(S.td); });
}
function onAct(e){
  const el=e.currentTarget, a=el.dataset.act, st=S.settings;
  switch(a){
    case "addfirst": addPlayer($("#firstname").value); break;
    case "addplayer": addPlayer($("#newplayer").value); break;
    case "askdel": S.confirmDel=el.dataset.id; render(); break;
    case "canceldel": S.confirmDel=null; render(); break;
    case "delplayer": S.players=S.players.filter(p=>p.id!==el.dataset.id); S.confirmDel=null; save(); render(); break;
    case "setupplayer": { const id=el.dataset.id; S.setupP = S.setupP.includes(id)? S.setupP.filter(x=>x!==id) : S.players.map(p=>p.id).filter(x=>S.setupP.includes(x)||x===id); render(); break; }
    case "setn": S.setupN=+el.dataset.n; render(); break;
    case "startround": if(!S.settings.calib) S.camLarge=true; S.round=newRound(S.setupP,S.setupN); S.rounds.unshift(S.round); S.last=null; S.showCard=false; save(); render(); break;
    case "replay": S.round=newRound(S.round.players,S.round.holes.length); S.rounds.unshift(S.round); S.last=null; save(); render(); break;
    case "closeround": S.round=null; render(); break;
    case "quitround": S.round=null; S.last=null; S.lastImpact=null; render(); break;
    case "scorecard": S.showCard=!S.showCard; render(); break;
    case "pd": st.practiceD=Math.max(0.5,Math.min(25,st.practiceD+(+el.dataset.v))); save(); render(); break;
    case "pslope": st.practiceSlope=el.dataset.v; save(); render(); break;
    case "practicep": S.practiceP=el.dataset.id; render(); break;
    case "startpractice": if(!st.calib) S.camLarge=true; S.practice={D:st.practiceD, green:newGreen(Math.random, st.practiceSlope==="flat")}; if(!S.practiceP) S.practiceP=S.players[0].id; S.last=null; render(); break;
    case "install": if(INSTALL_EVT){ const ev=INSTALL_EVT; INSTALL_EVT=null; ev.prompt(); ev.userChoice.finally(()=>render()); } break;
    case "hideinstall": st.hideInstall=true; save(); render(); break;
    case "shareapp": shareApp(); break;
    case "aimreset": S.aimPt=null; refreshAimInfo(curCtx()); drawGreen(); break;
    case "newgreen": S.practice.green=newGreen(Math.random, st.practiceSlope==="flat"); S.last=null; render(); break;
    case "quitpractice": S.practice=null; S.last=null; S.lastImpact=null; render(); break;
    case "togglecam": S.camLarge=!S.camLarge; render(); break;
    case "recalib": S.settings.calib=null; save(); LM.ball=null; LM.cand=null; LM.candN=0; if(LM.running){ LM.state="search"; setStatus("busy","Touche la balle sur l'image"); } render(); break;
    case "putdir": st.putDir=el.dataset.v; st.calib=null; setAim(); save(); render(); break;
    case "testshot": { const v=S.tv||1.8, d=S.td||0; const face=d/0.85+(Math.random()-0.5)*0.6; onShot({v, dir:d, face, faceMeasured:false}); break; }
    case "stimp": st.stimp=Math.max(6,Math.min(15,st.stimp+(+el.dataset.v))); save(); render(); break;
    case "aim": st.aimDeg=Math.max(-15,Math.min(15,st.aimDeg+(+el.dataset.v))); setAim(); save(); render(); break;
    case "ohtest": playOh(); break;
    case "ohreset": try{ localStorage.removeItem("puttlab-oh"); }catch(e){} OHBUF=null; render(); break;
    case "appltest": audioUnlock(); if(AC) applause(AC.currentTime+0.05,2.8); break;
    case "applreset": try{ localStorage.removeItem("puttlab-applause"); }catch(e){} APPLAUSE=null; render(); break;
    case "voicetest": sayText(t("À toi, {name}. ",{name:S.players[0]?S.players[0].name:"Benito"})+t("Trou {n}. ",{n:3})+t("Drapeau à {d}. ",{d:sayDist(6.4)})+t("En montée")+", "+sayPct(1)+". "+t("Ça casse vers la gauche."), true); break;
    case "lang": st.lang=el.dataset.v; save(); pickVoice(true); render(); break;
    case "listen": speakSituation(true); break;
    case "distk": st.distK=Math.max(0.3,Math.min(8,Math.round(((st.distK||1)+(+el.dataset.v))*10)/10)); save(); render(); break;
    case "calibk": { const real=parseFloat(String($("#realdist").value).replace(",",".")); const last=S.shots[S.shots.length-1];
      if(!(real>0)||!last||!(last.flat>0)) { toast(t("Entre la distance réelle en mètres.")); break; }
      st.distK=Math.max(0.3,Math.min(8,Math.round((st.distK||1)*real/last.flat*10)/10)); save(); render(); toast(t("Étalonnage réglé sur × {n}",{n:nf(st.distK,1)})); break; }
    case "statp": S.statP=el.dataset.id; render(); break;
    case "export": exportData(); break;
  }
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ S.tab=b.dataset.tab; S.last=null; render(); window.scrollTo(0,0); }));
function exportData(){
  const blob=new Blob([JSON.stringify({app:"puttlab-lm",v:1,date:Date.now(),players:S.players,rounds:S.rounds,shots:S.shots,settings:S.settings})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="square-face-putting-"+t("sauvegarde")+"-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
async function importData(file){
  try{ const j=JSON.parse(await file.text()); if(!j||!Array.isArray(j.players)) throw 0;
    const ids=new Set(S.players.map(p=>p.id)); j.players.forEach(p=>{ if(!ids.has(p.id)) S.players.push(p); });
    const rs=new Set(S.rounds.map(r=>r.id)); (j.rounds||[]).forEach(r=>{ if(!rs.has(r.id)) S.rounds.push(r); });
    const ts=new Set(S.shots.map(s=>s.t)); (j.shots||[]).forEach(s=>{ if(!ts.has(s.t)) S.shots.push(s); });
    S.shots.sort((a,b)=>a.t-b.t); save(); render(); toast(t("Sauvegarde importée"));
  }catch(e){ toast(t("Ce fichier n'est pas une sauvegarde Square Face Putting.")); }
}
window.addEventListener("resize",()=>{ if($("#green")) drawGreen(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) camStop(); else if($("#green")) camStart(); });

load(); render();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
